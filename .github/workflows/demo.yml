# Manual demo: the bad twin fails the gate, the good twin passes.
name: demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bad-twin:
    name: bad twin (expected to fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          files: examples/rag-chatbot-bad.mmd
          fail-on: high

  good-twin:
    name: good twin (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          files: examples/rag-chatbot-good.mmd
          fail-on: high
