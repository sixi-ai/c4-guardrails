name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Examples behave as documented
        run: |
          go build -o c4g ./cmd/c4g
          for f in examples/*-good.mmd; do ./c4g -fail-on low "$f"; done
          for f in examples/*-bad.mmd examples/*.c4.json; do
            set +e; ./c4g "$f" > /dev/null; code=$?; set -e
            test "$code" -eq 1 || { echo "expected exit 1 for $f, got $code"; exit 1; }
          done

  guardrails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run c4-guardrails on the examples
        id: c4g
        uses: ./
        with:
          files: "examples/*.mmd examples/*.c4.json"
          fail-on: none
          sarif: c4-guardrails.sarif
      - name: Upload SARIF to code scanning
        if: always() && steps.c4g.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: c4-guardrails.sarif
          category: c4-guardrails
